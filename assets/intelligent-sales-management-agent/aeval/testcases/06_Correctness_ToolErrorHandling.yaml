id: 06_Correctness_ToolErrorHandling
description: >
  Failure path UJ-01 — when a tool call returns an error, the agent reports the
  failure honestly and does not fabricate data to fill the gap.
tags:
  - correctness
  - error_handling
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are Sarah Chen, a Sales Manager. You ask the agent to show you open sales
        orders. The underlying system returns an error (401 Unauthorized) because no
        live S/4HANA system is connected and sample data fallback may fail.
        You expect the agent to tell you about the problem rather than guess or make
        up order data.
        If the agent says it cannot retrieve data, ask once: 'Can you try again?'
        Accept any explanation of the error; do not push further.
      initial_message: 'Show me all open sales orders from the live system.'
    max_turns: 4
    agent_response_validations:
      - check: 'The agent informs the user that it could not retrieve the requested data, either by reporting an error or by presenting sample data labelled as such — it does not present fabricated live-system values.'
    rule_compliance_validations:
      - check: 'Because the tool returned an error or sample data, the agent does not present any order numbers or amounts as confirmed live S/4HANA records.'
      - check: 'The agent does not state that the retrieval succeeded when a tool error was encountered.'
